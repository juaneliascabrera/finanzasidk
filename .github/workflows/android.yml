name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests JVM y APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK requerido
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ejecutar tests JVM
        run: ./gradlew :core:test :persistence:test --no-daemon --console=plain

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
